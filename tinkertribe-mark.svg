<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ink { stroke: #17293B; }
      .teal { stroke: #3F7D6C; }
      .amber { stroke: #D9A23B; fill: #D9A23B; }
      .amber-ink { stroke: #8A5E16; }
    </style>
  </defs>

  <!-- paper background circle -->
  <circle cx="120" cy="120" r="118" fill="#EDE7D9"/>

  <!-- orbit ring (astronomy) -->
  <ellipse cx="120" cy="120" rx="92" ry="62" class="teal" fill="none" stroke-width="2.5" stroke-dasharray="3 6" transform="rotate(-18 120 120)"/>
  <circle cx="190" cy="92" r="5" class="amber"/>

  <!-- gear ring (robotics / build) -->
  <g class="ink" fill="none" stroke-width="5" stroke-linecap="round">
    <circle cx="120" cy="120" r="52"/>
    <line x1="120" y1="60" x2="120" y2="46"/>
    <line x1="120" y1="180" x2="120" y2="194"/>
    <line x1="60" y1="120" x2="46" y2="120"/>
    <line x1="180" y1="120" x2="194" y2="120"/>
    <line x1="78" y1="78" x2="68" y2="68"/>
    <line x1="162" y1="162" x2="172" y2="172"/>
    <line x1="78" y1="162" x2="68" y2="172"/>
    <line x1="162" y1="78" x2="172" y2="68"/>
  </g>

  <!-- spark / idea center (electronics) -->
  <g class="amber-ink" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 128 92 L 104 128 L 120 128 L 112 150 L 140 112 L 122 112 Z" fill="#D9A23B" stroke="#8A5E16"/>
  </g>
</svg>
