<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>

  <text x="450" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Pull-Pull Thread Rudder Control — Top View</text>
  <text x="450" y="58" font-size="13" text-anchor="middle" fill="#555">No rigid pushrod needed. Two threads pull against each other from the servo arm to the rudder horn.</text>

  <!-- Fuselage centerline -->
  <line x1="80" y1="300" x2="820" y2="300" stroke="#ccc" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="90" y="290" font-size="11" fill="#999">fuselage centerline</text>

  <!-- Servo body (near front-ish of tail section) -->
  <g>
    <rect x="150" y="260" width="70" height="80" rx="4" fill="#cfe8ff" stroke="#2266cc" stroke-width="2"/>
    <text x="185" y="305" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">RUDDER</text>
    <text x="185" y="320" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">SERVO</text>
  </g>

  <!-- Servo arm (horn) sticking up, pivots left-right -->
  <g>
    <circle cx="220" cy="300" r="5" fill="#2266cc"/>
    <line x1="220" y1="300" x2="255" y2="270" stroke="#2266cc" stroke-width="4"/>
    <circle cx="255" cy="270" r="4" fill="#2266cc"/>
    <line x1="220" y1="300" x2="255" y2="330" stroke="#2266cc" stroke-width="4"/>
    <circle cx="255" cy="330" r="4" fill="#2266cc"/>
    <text x="260" y="260" font-size="10" fill="#2266cc">servo arm</text>
    <text x="260" y="260" font-size="10" fill="#2266cc">(rotates ± each way)</text>
  </g>

  <!-- Rudder hinge line, at the tail -->
  <line x1="700" y1="200" x2="700" y2="400" stroke="#333" stroke-width="3"/>
  <text x="705" y="195" font-size="11" fill="#333">rudder hinge line</text>

  <!-- Rudder surface, shown deflected slightly for illustration -->
  <polygon points="700,220 800,235 800,365 700,380" fill="#fce4ec" stroke="#111" stroke-width="2"/>
  <text x="750" y="300" font-size="12" text-anchor="middle" fill="#222">RUDDER</text>
  <text x="750" y="316" font-size="12" text-anchor="middle" fill="#222">(moving surface)</text>

  <!-- Rudder horn - small tab sticking forward from the hinge, with two attach points -->
  <line x1="700" y1="270" x2="660" y2="255" stroke="#8b5a2b" stroke-width="4"/>
  <circle cx="660" cy="255" r="4" fill="#8b5a2b"/>
  <line x1="700" y1="330" x2="660" y2="345" stroke="#8b5a2b" stroke-width="4"/>
  <circle cx="660" cy="345" r="4" fill="#8b5a2b"/>
  <text x="600" y="240" font-size="10" fill="#8b5a2b">rudder horn (tiny stiff tab —</text>
  <text x="600" y="253" font-size="10" fill="#8b5a2b">sliver of ice-cream stick or</text>
  <text x="600" y="266" font-size="10" fill="#8b5a2b">stiff card, glued to hinge line)</text>

  <!-- Thread A: servo arm top -> rudder horn top -->
  <line x1="255" y1="270" x2="660" y2="255" stroke="#e63946" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="420" y="245" font-size="11" fill="#e63946" text-anchor="middle">Thread A (top)</text>

  <!-- Thread B: servo arm bottom -> rudder horn bottom -->
  <line x1="255" y1="330" x2="660" y2="345" stroke="#2a9d8f" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="420" y="365" font-size="11" fill="#2a9d8f" text-anchor="middle">Thread B (bottom)</text>

  <!-- Fuselage strip outline for context -->
  <rect x="80" y="285" width="740" height="30" fill="none" stroke="#bbb" stroke-width="1"/>

  <!-- Explanation box -->
  <rect x="60" y="430" width="780" height="150" fill="#f7f7f7" stroke="#ccc" stroke-width="1"/>
  <text x="80" y="452" font-size="13" font-weight="bold" fill="#222">How it works:</text>
  <text x="80" y="472" font-size="12" fill="#333">1. Servo arm rotates clockwise → Thread A goes slack, Thread B pulls tight → rudder horn pulled toward bottom thread → rudder deflects that way</text>
  <text x="80" y="490" font-size="12" fill="#333">2. Servo arm rotates counter-clockwise → Thread B goes slack, Thread A pulls tight → rudder deflects the opposite way</text>
  <text x="80" y="508" font-size="12" fill="#333">3. Both threads must stay taut at center (no slack) — this is the key tuning step. Tie off, apply a tiny drop of CA glue at each knot, then trim excess.</text>
  <text x="80" y="530" font-size="12" fill="#333">Materials: button thread, dental floss, or thin fishing line (10-20cm each). Attach with small overhand knots</text>
  <text x="80" y="547" font-size="12" fill="#333">through tiny holes in the servo arm and rudder horn — a pin or small drill bit makes a clean attachment hole.</text>
  <text x="80" y="565" font-size="12" fill="#333">Weight: a fraction of a gram total — the lightest possible control linkage at this scale.</text>

</svg>
