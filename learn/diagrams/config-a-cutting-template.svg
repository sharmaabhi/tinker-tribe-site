<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="700" fill="#ffffff" stroke="none"/>

  <!-- Title -->
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Config A — Cutting Template (foam board, ~1-2mm)</text>
  <text x="450" y="52" font-size="13" text-anchor="middle" fill="#555">Solid black lines = straight cuts. Dashed red lines = angled/mark cuts. Blue dash = fold/hinge line.</text>

  <!-- ============ WING ============ -->
  <text x="150" y="90" font-size="15" font-weight="bold" fill="#222">WING (top view) — span 280mm x chord 65mm</text>

  <!-- Wing shape: rectangular center with 45deg angled tip cuts -->
  <g stroke="#111" stroke-width="2" fill="#eef6ff">
    <!-- main rectangle body from x=60 to x=740 (680 wide representing 280mm scaled), height 65 scaled -->
    <polygon points="
      100,150
      150,120
      690,120
      740,150
      690,180
      150,180
    " />
  </g>
  <!-- angled tip cut lines highlighted -->
  <line x1="100" y1="150" x2="150" y2="120" stroke="#d33" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="100" y1="150" x2="150" y2="180" stroke="#d33" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="740" y1="150" x2="690" y2="120" stroke="#d33" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="740" y1="150" x2="690" y2="180" stroke="#d33" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Wing dihedral fold line (center) -->
  <line x1="420" y1="120" x2="420" y2="180" stroke="#2266cc" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="425" y="200" font-size="11" fill="#2266cc">center fold line —</text>
  <text x="425" y="213" font-size="11" fill="#2266cc">score + bend ~10-15° dihedral each side after cutting</text>

  <!-- dims -->
  <text x="420" y="105" font-size="12" text-anchor="middle" fill="#333">280mm span (tip to tip)</text>
  <text x="60" y="168" font-size="11" fill="#333" text-anchor="end">65mm</text>
  <text x="150" y="112" font-size="11" fill="#d33">45° angled tip cut</text>
  <text x="690" y="112" font-size="11" fill="#d33" text-anchor="end">45° angled tip cut</text>

  <!-- ============ FUSELAGE ============ -->
  <text x="150" y="270" font-size="15" font-weight="bold" fill="#222">FUSELAGE STRIP (side view) — length 220mm</text>

  <g stroke="#111" stroke-width="2" fill="#fff3e0">
    <polygon points="
      100,320
      140,300
      680,300
      680,340
      140,340
    "/>
  </g>
  <line x1="100" y1="320" x2="140" y2="300" stroke="#d33" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="100" y1="320" x2="140" y2="340" stroke="#d33" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="100" y="290" font-size="11" fill="#d33">angled nose point</text>
  <text x="390" y="290" font-size="12" text-anchor="middle" fill="#333">220mm length</text>
  <text x="690" y="325" font-size="11" fill="#333">18-20mm</text>
  <text x="680" y="360" font-size="11" fill="#333" text-anchor="end">straight, flat tail end (no angle cut)</text>

  <!-- firewall mark -->
  <line x1="115" y1="300" x2="115" y2="340" stroke="#2266cc" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="118" y="405" font-size="11" fill="#2266cc">firewall glued here</text>
  <text x="118" y="418" font-size="11" fill="#2266cc">(laminated ice-cream sticks)</text>

  <!-- ============ TAILS ============ -->
  <text x="150" y="470" font-size="15" font-weight="bold" fill="#222">HORIZONTAL TAIL (elevator) — 90mm x 30mm</text>

  <g stroke="#111" stroke-width="2" fill="#e8f5e9">
    <polygon points="
      100,500
      370,500
      370,530
      100,530
    "/>
  </g>
  <!-- hinge line for elevator, rear 12mm -->
  <line x1="330" y1="500" x2="330" y2="530" stroke="#2266cc" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="332" y="545" font-size="10" fill="#2266cc">hinge line (rear 12mm = moving elevator)</text>
  <text x="100" y="490" font-size="11" fill="#333">straight rectangle, no angled cuts needed</text>

  <text x="500" y="470" font-size="15" font-weight="bold" fill="#222">VERTICAL TAIL (rudder) — 50mm h x 35mm chord</text>

  <!-- vertical tail shape: straight front edge, angled top-back cut (classic fin shape) -->
  <g stroke="#111" stroke-width="2" fill="#fce4ec">
    <polygon points="
      520,530
      520,470
      600,480
      600,530
    "/>
  </g>
  <line x1="520" y1="470" x2="600" y2="480" stroke="#d33" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="605" y="478" font-size="11" fill="#d33">angled top cut</text>
  <!-- rudder hinge, rear 15mm -->
  <line x1="580" y1="470" x2="580" y2="530" stroke="#2266cc" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="520" y="545" font-size="10" fill="#2266cc">hinge line (rear 15mm = moving rudder)</text>

  <!-- ============ Legend / summary ============ -->
  <rect x="60" y="590" width="780" height="90" fill="#f7f7f7" stroke="#ccc" stroke-width="1"/>
  <text x="80" y="612" font-size="13" font-weight="bold" fill="#222">Cut summary:</text>
  <text x="80" y="632" font-size="12" fill="#333">• Wing: mostly straight edges, 2x 45° angled cuts at the tips only</text>
  <text x="80" y="649" font-size="12" fill="#333">• Fuselage: straight top/bottom/tail, 2x angled cuts forming the pointed nose</text>
  <text x="80" y="666" font-size="12" fill="#333">• Horizontal tail: fully rectangular, zero angled cuts • Vertical tail: 1 angled cut for the classic fin taper at the top-rear</text>
  <text x="500" y="612" font-size="12" fill="#333">Blue dashed = fold or hinge line (score, don't cut through)</text>
  <text x="500" y="632" font-size="12" fill="#333">Red dashed = angled cut line</text>
  <text x="500" y="649" font-size="12" fill="#333">Black solid = straight cut line</text>

</svg>
